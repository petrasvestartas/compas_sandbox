[build-system]
# nanobind 3.x dropped Python 3.9, which Rhino 8 still ships - stay on 2.x
requires = ["scikit-build-core>=0.10", "nanobind>=2.2,<3"]
build-backend = "scikit_build_core.build"

# ============================================================================
# project info
# ============================================================================

[project]
name = "compas_sandbox"
description = ""
keywords = []
authors = [{ name = "Gene Ting-Chun Kao", email = "kao@arch.ethz.ch" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "compas>=2.4",
    "compas_assembly>=0.7.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "shapely>=2.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.optional-dependencies]
dev = [
    "attrs>=17.4",
    "black>=22.12.0",
    "build",
    "bump-my-version",
    "compas_invocations2",
    "compas_viewer",
    "invoke>=0.14",
    "pytest",
    "ruff",
    "sphinx_compas2_theme",
    "twine",
    "wheel",
]
viz = ["compas_viewer", "matplotlib"]

[project.urls]
Homepage = "https://github.com/petrasvestartas/compas_sandbox"
Documentation = "https://github.com/petrasvestartas/compas_sandbox"
Repository = "https://github.com/petrasvestartas/compas_sandbox.git"
Changelog = "https://github.com/petrasvestartas/compas_sandbox/blob/main/CHANGELOG.md"

# ============================================================================
# build config
# ============================================================================
#
# compas_sandbox ships its own solver: IPOPT and the MUMPS linear solver are compiled
# into the in-package extension module `compas_sandbox._core` rather than being pulled
# in from a separate `compas_sandbox_native` distribution. That makes this a
# platform-specific wheel instead of a universal one, and it means the version of the
# Python code and the version of the solver it runs on can no longer drift apart.
#
# The CMake project lives in native/ and needs the static IPOPT stage tree produced by
# packaging/build_ipopt.sh; point IPOPT_PREFIX at it before building from source.

[tool.scikit-build]
minimum-version = "0.10"
cmake.source-dir = "native"
wheel.packages = ["src/compas_sandbox"]
# stripping would invalidate the macOS ad-hoc code signature; arm64 kills unsigned code
install.strip = false
sdist.include = ["native/", "packaging/"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/compas_sandbox/__init__.py"

# ============================================================================
# replace pytest.ini
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src/compas_sandbox"]
python_files = ["test_*.py", "*_test.py", "test.py"]
addopts = ["-ra", "--strict-markers", "--doctest-glob=*.rst", "--tb=short"]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]

# ============================================================================
# replace bumpversion.cfg
# ============================================================================

[tool.bumpversion]
current_version = "0.7.4"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "src/compas_sandbox/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

# ============================================================================
# replace setup.cfg
# ============================================================================

[tool.black]
line-length = 119

[tool.ruff]
line-length = 119
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
