name: release

# The full, ordered release: build the compas_sandbox_native wheels first, test the
# pure compas_sandbox package against those freshly built wheels, then publish
# native -> sandbox in that order, so a version floor on the native package can never
# reference something not yet on PyPI. Runs on v* tags only; push CI for the native
# code lives in native.yml (build-only).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IPOPT_VERSION: "3.14.19"

jobs:
  native-linux:
    name: native-${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            tag: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            tag: manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y --enablerepo=powertools
            glibc-static libstdc++-static openblas-static openblas-devel &&
            env CFLAGS="-O2 -fPIC" CXXFLAGS="-O2 -fPIC" FFLAGS="-O2 -fPIC" FCFLAGS="-O2 -fPIC"
            {project}/packaging/build_ipopt.sh
          CIBW_ENVIRONMENT_LINUX: IPOPT_PREFIX=/project/build/ipopt/stage
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: python {package}/tests/smoke.py
        run: |
          python -m pip install -q cibuildwheel
          python -m cibuildwheel native --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.tag }}
          path: dist/*.whl

  native-macos:
    name: native-${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            tag: macosx_arm64
            deployment_target: "14.0"
          - os: macos-15-intel
            tag: macosx_x86_64
            deployment_target: "15.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          brew list gcc >/dev/null 2>&1 || brew install gcc
          test -x "$(brew --prefix)/bin/gfortran" || \
            ln -sf "$(ls "$(brew --prefix)"/bin/gfortran-* | tail -1)" "$(brew --prefix)/bin/gfortran"
      - name: Cache ipopt build
        id: cache-ipopt
        uses: actions/cache@v4
        with:
          path: build/ipopt/stage
          key: ipopt-stage-${{ env.IPOPT_VERSION }}-${{ matrix.tag }}-${{ hashFiles('packaging/build_ipopt.sh') }}
      - name: Build ipopt
        if: steps.cache-ipopt.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: packaging/build_ipopt.sh
      - name: Build wheels
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_ENVIRONMENT: >-
            IPOPT_PREFIX=${{ github.workspace }}/build/ipopt/stage
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: python {package}/tests/smoke.py
        run: |
          python -m pip install -q cibuildwheel
          python -m cibuildwheel native --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.tag }}
          path: dist/*.whl

  native-windows:
    name: native-win_amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          location: D:\
          install: >-
            git
            patch
            make
            diffutils
            pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-openblas
      - name: Cache ipopt build
        id: cache-ipopt
        uses: actions/cache@v4
        with:
          path: build/ipopt/stage
          key: ipopt-stage-${{ env.IPOPT_VERSION }}-win_amd64-${{ hashFiles('packaging/build_ipopt.sh') }}
      - name: Build ipopt
        if: steps.cache-ipopt.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: packaging/build_ipopt.sh
      - name: Build wheels
        shell: bash
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ENVIRONMENT: >-
            IPOPT_PREFIX='${{ github.workspace }}\build\ipopt\stage'
            EXTRA_LINK_DIRS='D:\msys64\ucrt64\lib'
            CMAKE_GENERATOR=Ninja
            CMAKE_ARGS='-DCMAKE_C_COMPILER=D:/msys64/ucrt64/bin/gcc.exe -DCMAKE_CXX_COMPILER=D:/msys64/ucrt64/bin/g++.exe -DFORTRAN_COMPILER=D:/msys64/ucrt64/bin/gfortran.exe'
          CIBW_BEFORE_BUILD: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-path D:\msys64\ucrt64\bin -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: python {package}/tests/smoke.py
        run: |
          python -m pip install -q cibuildwheel
          python -m cibuildwheel native --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-win_amd64
          path: dist/*.whl

  native-sdist:
    name: native-sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build --sdist native --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-sdist
          path: dist/*.tar.gz

  build:
    name: build compas_sandbox
    needs: native-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build
      - uses: actions/download-artifact@v4
        with:
          name: native-manylinux_2_28_x86_64
          path: native-dist
      - name: Test the built wheel against the just-built native wheel
        run: |
          python -m venv venv-test
          venv-test/bin/pip install -q native-dist/compas_sandbox_native-*-cp312-*.whl dist/*.whl pytest
          cd /tmp && "$GITHUB_WORKSPACE/venv-test/bin/python" -m pytest "$GITHUB_WORKSPACE/tests" -v
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-native:
    name: publish compas_sandbox_native to PyPI
    needs: [native-linux, native-macos, native-windows, native-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - run: ls -lh dist
      # re-tagging without a native version bump republishes nothing, deliberately
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish:
    name: publish compas_sandbox to PyPI
    needs: [build, publish-native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: create GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
