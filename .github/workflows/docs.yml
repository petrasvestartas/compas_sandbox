name: docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docs:
    runs-on: macos-latest
    permissions:
      contents: write  # the docs action pushes the built site to the gh-pages branch
    steps:
      - uses: compas-dev/compas-actions.docs@v4
        with:
          use_conda: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
