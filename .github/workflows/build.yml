name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    if: "!contains(github.event.pull_request.labels.*.name, 'docs-only')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # linting needs no package install — keeping it dependency-free means a PyPI
      # propagation delay can never fail this job
      - name: Lint
        run: |
          python -m pip install -q ruff invoke compas_invocations2
          invoke lint

  # The full solve chain on every push: install the package (which pulls the
  # compas_sandbox_native solver wheel) and run the test suite, which solves real
  # assemblies — box, cubes, the 20-block arch — through the in-process IPOPT.
  test:
    if: "!contains(github.event.pull_request.labels.*.name, 'docs-only')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]  # 3.9 is the Rhino 8 floor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e . pytest

      - name: Solve with IPOPT (test suite)
        run: python -m pytest tests -v
