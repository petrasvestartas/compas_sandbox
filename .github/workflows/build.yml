name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    if: "!contains(github.event.pull_request.labels.*.name, 'docs-only')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # linting needs no package install — keeping it dependency-free means a PyPI
      # propagation delay can never fail this job
      - name: Lint
        run: |
          python -m pip install -q ruff invoke compas_invocations2
          invoke lint

  # The test suite runs against the built wheels in release.yml (on tags) and the
  # native wheel matrix in native.yml (on native code pushes).
