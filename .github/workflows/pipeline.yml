name: pipeline

# The single build pipeline, used by build.yml (every push, publish: false) and
# release.yml (tags, publish: true). Always the full chain: IPOPT compiled from
# source and linked into the compas_sandbox wheel for every platform, each wheel
# smoke-tested, then the full test suite run against a built wheel. With
# publish: true it also deploys the docs. The PyPI upload and the GitHub release are
# in release.yml, not here: trusted publishing cannot match a job that lives in a
# reusable workflow - see the note at the top of release.yml.
#
# compas_sandbox ships its own solver, so there is one package and one version here:
# the wheels below ARE the release. There is no separate compas_sandbox_native
# distribution to keep in step any more.

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

env:
  IPOPT_VERSION: "3.14.19"
  CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
  CIBW_TEST_COMMAND: "python {package}/tests/smoke.py"

jobs:
  wheels-linux:
    name: wheels-${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            tag: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            tag: manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        env:
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y --enablerepo=powertools
            glibc-static libstdc++-static openblas-static openblas-devel &&
            env CFLAGS="-O2 -fPIC" CXXFLAGS="-O2 -fPIC" FFLAGS="-O2 -fPIC" FCFLAGS="-O2 -fPIC"
            {project}/packaging/build_ipopt.sh
          CIBW_ENVIRONMENT_LINUX: IPOPT_PREFIX=/project/build/ipopt/stage
        run: |
          python -m pip install -q cibuildwheel
          python -m cibuildwheel . --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.tag }}
          path: dist/*.whl

  wheels-macos:
    name: wheels-${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            tag: macosx_arm64
            deployment_target: "14.0"
          - os: macos-15-intel
            tag: macosx_x86_64
            deployment_target: "15.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          brew list gcc >/dev/null 2>&1 || brew install gcc
          test -x "$(brew --prefix)/bin/gfortran" || \
            ln -sf "$(ls "$(brew --prefix)"/bin/gfortran-* | tail -1)" "$(brew --prefix)/bin/gfortran"
      - name: Cache ipopt build
        id: cache-ipopt
        uses: actions/cache@v4
        with:
          path: build/ipopt/stage
          key: ipopt-stage-${{ env.IPOPT_VERSION }}-${{ matrix.tag }}-${{ hashFiles('packaging/build_ipopt.sh') }}
      - name: Build ipopt
        if: steps.cache-ipopt.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: packaging/build_ipopt.sh
      - name: Show ipopt build logs on failure
        if: failure()
        shell: bash
        run: |
          # coinbrew prints "Build failed, see error output above" and then swallows the
          # actual compiler/linker error, so dig the per-project logs out of the tree
          echo "--- logs under build/ipopt ---"
          find build/ipopt -name "*.log" 2>/dev/null | head -30 | while read -r f; do
            echo "===================== $f ====================="
            tail -150 "$f"
          done
      - name: Build wheels
        env:
          CIBW_ENVIRONMENT: >-
            IPOPT_PREFIX=${{ github.workspace }}/build/ipopt/stage
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}
        run: |
          python -m pip install -q cibuildwheel
          python -m cibuildwheel . --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.tag }}
          path: dist/*.whl

  wheels-windows:
    name: wheels-win_amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          location: D:\
          install: >-
            git
            patch
            make
            diffutils
            pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-openblas
      - name: Cache ipopt build
        id: cache-ipopt
        uses: actions/cache@v4
        with:
          path: build/ipopt/stage
          key: ipopt-stage-${{ env.IPOPT_VERSION }}-win_amd64-${{ hashFiles('packaging/build_ipopt.sh') }}
      - name: Build ipopt
        if: steps.cache-ipopt.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: packaging/build_ipopt.sh
      - name: Show ipopt build logs on failure
        if: failure()
        shell: bash
        run: |
          # coinbrew prints "Build failed, see error output above" and then swallows the
          # actual compiler/linker error, so dig the per-project logs out of the tree
          echo "--- logs under build/ipopt ---"
          find build/ipopt -name "*.log" 2>/dev/null | head -30 | while read -r f; do
            echo "===================== $f ====================="
            tail -150 "$f"
          done
      - name: Build wheels
        shell: bash
        env:
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ENVIRONMENT: >-
            IPOPT_PREFIX='${{ github.workspace }}\build\ipopt\stage'
            EXTRA_LINK_DIRS='D:\msys64\ucrt64\lib'
            CMAKE_GENERATOR=Ninja
            CMAKE_ARGS='-DCMAKE_C_COMPILER=D:/msys64/ucrt64/bin/gcc.exe -DCMAKE_CXX_COMPILER=D:/msys64/ucrt64/bin/g++.exe -DFORTRAN_COMPILER=D:/msys64/ucrt64/bin/gfortran.exe'
          CIBW_BEFORE_BUILD: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-path D:\msys64\ucrt64\bin -w {dest_dir} {wheel}
        run: |
          python -m pip install -q cibuildwheel
          python -m cibuildwheel . --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-win_amd64
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build --sdist . --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test:
    name: test the built wheel
    needs: wheels-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-manylinux_2_28_x86_64
          path: dist
      # install the wheel, not the source tree: this proves the shipped artifact
      # carries a working solver, which is the thing that used to be able to drift
      - name: Run the test suite against the wheel
        run: |
          python -m venv venv-test
          venv-test/bin/pip install -q dist/compas_sandbox-*-cp312-*manylinux*.whl pytest
          # fail loudly if the wheel has no solver, so the tests cannot skip past it
          venv-test/bin/python -c "from compas_sandbox import _core; print('IPOPT', _core.IPOPT_VERSION)"
          cd /tmp && "$GITHUB_WORKSPACE/venv-test/bin/python" -m pytest "$GITHUB_WORKSPACE/tests" -v

  docs:
    name: docs
    needs: wheels-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write  # deploying pushes the built site to the gh-pages branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-manylinux_2_28_x86_64
          path: dist
      # install the built wheel rather than the source tree: an editable install would
      # have to compile the extension, and this job has no IPOPT stage tree
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1
          python -m pip install -q --upgrade pip
          python -m pip install -q "$(ls dist/compas_sandbox-*-cp312-*manylinux*.whl)[dev]"
      - name: Build docs
        run: |
          invoke docs
          test -f dist/docs/index.html
      - name: Deploy docs
        if: inputs.publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/docs
