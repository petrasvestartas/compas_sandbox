name: native

# Build-only CI for the compas_sandbox_native wheels: validates native code changes
# on push. Publishing happens exclusively in release.yml, which builds the same
# matrix in order (natives first, then the pure package) on v* tags.

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "src/compas_sandbox/nlp/**"
      - "packaging/build_ipopt.sh"
      - ".github/workflows/native.yml"
  workflow_dispatch:

env:
  IPOPT_VERSION: "3.14.19"
  PYTHONS: "cp39 cp310 cp311 cp312 cp313"

jobs:
  linux:
    name: native-${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            tag: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            tag: manylinux_2_28_aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"  # glibc wheels only, same coverage as before
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          # everything builds inside the manylinux container: dependencies, then IPOPT
          # itself with PIC objects so the static archives link into the extension
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y --enablerepo=powertools
            glibc-static libstdc++-static openblas-static openblas-devel &&
            env CFLAGS="-O2 -fPIC" CXXFLAGS="-O2 -fPIC" FFLAGS="-O2 -fPIC" FCFLAGS="-O2 -fPIC"
            {project}/packaging/build_ipopt.sh
          CIBW_ENVIRONMENT_LINUX: IPOPT_PREFIX=/project/build/ipopt/stage
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: python {package}/tests/smoke.py
        run: |
          python -m pip install -q cibuildwheel
          python -m cibuildwheel native --output-dir dist
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.tag }}
          path: dist/*.whl

  macos:
    name: native-${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14: Homebrew's libgfortran bottle there targets macOS 14, so the
          # wheels reach macOS 14+ instead of 15+
          - os: macos-14
            tag: macosx_arm64
            deployment_target: "14.0"
          - os: macos-15-intel
            tag: macosx_x86_64
            deployment_target: "15.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          brew list gcc >/dev/null 2>&1 || brew install gcc
          test -x "$(brew --prefix)/bin/gfortran" || \
            ln -sf "$(ls "$(brew --prefix)"/bin/gfortran-* | tail -1)" "$(brew --prefix)/bin/gfortran"
          gfortran --version | head -1

      - name: Cache ipopt build
        id: cache-ipopt
        uses: actions/cache@v4
        with:
          path: build/ipopt/stage
          key: ipopt-stage-${{ env.IPOPT_VERSION }}-${{ matrix.tag }}-${{ hashFiles('packaging/build_ipopt.sh') }}

      - name: Build ipopt
        if: steps.cache-ipopt.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: packaging/build_ipopt.sh

      - name: Build wheels
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          # the bundled Homebrew libgfortran targets the runner's macOS, so the wheel
          # has to as well
          CIBW_ENVIRONMENT: >-
            IPOPT_PREFIX=${{ github.workspace }}/build/ipopt/stage
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: python {package}/tests/smoke.py
        run: |
          python -m pip install -q cibuildwheel
          python -m cibuildwheel native --output-dir dist
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.tag }}
          path: dist/*.whl

  windows:
    name: native-win_amd64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          location: D:\  # deterministic install root: D:\msys64
          install: >-
            git
            patch
            make
            diffutils
            pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-openblas

      - name: Cache ipopt build
        id: cache-ipopt
        uses: actions/cache@v4
        with:
          path: build/ipopt/stage
          key: ipopt-stage-${{ env.IPOPT_VERSION }}-win_amd64-${{ hashFiles('packaging/build_ipopt.sh') }}

      - name: Build ipopt
        if: steps.cache-ipopt.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: packaging/build_ipopt.sh

      - name: Build wheels
        shell: bash
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_ARCHS_WINDOWS: AMD64  # the mingw toolchain is 64-bit only
          # build the extension with the same mingw toolchain that built ipopt/MUMPS
          CIBW_ENVIRONMENT: >-
            IPOPT_PREFIX='${{ github.workspace }}\build\ipopt\stage'
            EXTRA_LINK_DIRS='D:\msys64\ucrt64\lib'
            CMAKE_GENERATOR=Ninja
            CMAKE_ARGS='-DCMAKE_C_COMPILER=D:/msys64/ucrt64/bin/gcc.exe -DCMAKE_CXX_COMPILER=D:/msys64/ucrt64/bin/g++.exe -DFORTRAN_COMPILER=D:/msys64/ucrt64/bin/gfortran.exe'
          CIBW_BEFORE_BUILD: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-path D:\msys64\ucrt64\bin -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: python {package}/tests/smoke.py
        run: |
          python -m pip install -q cibuildwheel
          python -m cibuildwheel native --output-dir dist
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: native-win_amd64
          path: dist/*.whl
