name: native

# Builds compas_sandbox_native wheels — IPOPT bound into a Python extension — for
# manylinux (x86_64, aarch64), macOS (arm64, Intel) and Windows, CPython 3.9–3.13.
# IPOPT itself is compiled by packaging/build_ipopt.sh, same as for the exe wheels,
# but with PIC objects so the static archives can link into a shared module.

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "src/compas_sandbox/nlp/**"
      - "packaging/build_ipopt.sh"
      - ".github/workflows/native.yml"
    tags: ["v*"]
  workflow_dispatch:

env:
  IPOPT_VERSION: "3.14.19"
  PYTHONS: "cp39 cp310 cp311 cp312 cp313"

jobs:
  linux:
    name: native-${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            tag: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            tag: manylinux_2_28_aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y --enablerepo=powertools \
            glibc-static libstdc++-static openblas-static openblas-devel

      - name: Cache PIC ipopt build
        id: cache-ipopt
        uses: actions/cache@v4
        with:
          path: build/ipopt/stage
          key: ipopt-stage-pic-${{ env.IPOPT_VERSION }}-${{ matrix.tag }}-${{ hashFiles('packaging/build_ipopt.sh') }}

      - name: Build ipopt (PIC)
        if: steps.cache-ipopt.outputs.cache-hit != 'true'
        run: |
          export CFLAGS="-O2 -fPIC" CXXFLAGS="-O2 -fPIC" FFLAGS="-O2 -fPIC" FCFLAGS="-O2 -fPIC"
          packaging/build_ipopt.sh

      - name: Build wheels
        run: |
          export IPOPT_PREFIX="$PWD/build/ipopt/stage"
          mkdir -p raw dist
          for py in $PYTHONS; do
            pybin=$(ls -d /opt/python/${py}-${py}*/bin | head -1)
            echo "=== $pybin ==="
            "$pybin/python" -m pip wheel ./native --no-deps -w raw
          done
          for whl in raw/*.whl; do
            auditwheel repair "$whl" -w dist
          done
          ls -lh dist

      - name: Test each wheel
        run: |
          for py in $PYTHONS; do
            pybin=$(ls -d /opt/python/${py}-${py}*/bin | head -1)
            "$pybin/python" -m pip install -q numpy dist/compas_sandbox_native-*-${py}-*.whl
            "$pybin/python" native/tests/smoke.py
          done

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.tag }}
          path: dist/*.whl

  macos:
    name: native-${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            tag: macosx_arm64
          - os: macos-15-intel
            tag: macosx_x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          brew list gcc >/dev/null 2>&1 || brew install gcc
          test -x "$(brew --prefix)/bin/gfortran" || \
            ln -sf "$(ls "$(brew --prefix)"/bin/gfortran-* | tail -1)" "$(brew --prefix)/bin/gfortran"
          gfortran --version | head -1

      - name: Cache ipopt build
        id: cache-ipopt
        uses: actions/cache@v4
        with:
          path: build/ipopt/stage
          key: ipopt-stage-${{ env.IPOPT_VERSION }}-${{ matrix.tag }}-${{ hashFiles('packaging/build_ipopt.sh') }}

      - name: Build ipopt
        if: steps.cache-ipopt.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: packaging/build_ipopt.sh

      - name: Build wheels
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          # the bundled Homebrew libgfortran targets the runner's macOS, so the wheel
          # has to as well — these wheels need macOS 15+
          CIBW_ENVIRONMENT: >-
            IPOPT_PREFIX=${{ github.workspace }}/build/ipopt/stage
            MACOSX_DEPLOYMENT_TARGET=15.0
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: python {package}/tests/smoke.py
        run: |
          python -m pip install -q cibuildwheel
          python -m cibuildwheel native --output-dir dist
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.tag }}
          path: dist/*.whl

  windows:
    name: native-win_amd64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          location: D:\  # deterministic install root: D:\msys64
          install: >-
            git
            patch
            make
            diffutils
            pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-openblas

      - name: Cache ipopt build
        id: cache-ipopt
        uses: actions/cache@v4
        with:
          path: build/ipopt/stage
          key: ipopt-stage-${{ env.IPOPT_VERSION }}-win_amd64-${{ hashFiles('packaging/build_ipopt.sh') }}

      - name: Build ipopt
        if: steps.cache-ipopt.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: packaging/build_ipopt.sh

      - name: Build wheels
        shell: bash
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_ARCHS_WINDOWS: AMD64  # the mingw toolchain is 64-bit only
          # build the extension with the same mingw toolchain that built ipopt/MUMPS
          CIBW_ENVIRONMENT: >-
            IPOPT_PREFIX='${{ github.workspace }}\build\ipopt\stage'
            EXTRA_LINK_DIRS='D:\msys64\ucrt64\lib'
            CMAKE_GENERATOR=Ninja
            CMAKE_ARGS='-DCMAKE_C_COMPILER=D:/msys64/ucrt64/bin/gcc.exe -DCMAKE_CXX_COMPILER=D:/msys64/ucrt64/bin/g++.exe -DFORTRAN_COMPILER=D:/msys64/ucrt64/bin/gfortran.exe'
          CIBW_BEFORE_BUILD: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-path D:\msys64\ucrt64\bin -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: python {package}/tests/smoke.py
        run: |
          python -m pip install -q cibuildwheel
          python -m cibuildwheel native --output-dir dist
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: native-win_amd64
          path: dist/*.whl

  sdist:
    name: native-sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build --sdist native --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [linux, macos, windows, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - run: ls -lh dist
      # the native package version is independent of compas_sandbox releases, so a tag
      # that does not bump native/pyproject.toml must not fail on re-upload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
